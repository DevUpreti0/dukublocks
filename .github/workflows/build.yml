name: DuKu FCA build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate Linux terminal API syntax
        run: node --check api/dev-terminal.js
      - name: Compile production bundle
        env:
          CI: "true"
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run build
